name: Apply mobile visual hotfix
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach hotfix assets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="fixes.css?v=20260823-2">'
          js='<script src="fixes.js?v=20260823-2"></script>'
          if css not in s:
              s=s.replace('</head>',css+'</head>')
          if js not in s:
              s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit patched entrypoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: activate mobile visual hotfix"
          git push
